<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jeremy – Reports</title>
  <meta name="description" content="Report index">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">Jeremy</a>
    <button id="theme-toggle" type="button" aria-label="Toggle theme">◐</button>
  </header>

  <main>
    <section class="hero">
      <h1>Reports</h1>
      <p>Project manager for the filter. Pick a report below.</p>
    </section>

    <section aria-label="Report index">
      <h2 class="category">Power BI</h2>
      <div class="reports">
      <a class="report" href="reports/sales.html">
        <span class="num">R01</span>
        <span class="info"><strong>Sales Report</strong><small>Revenue, orders and sales performance.</small></span>
        <span class="go" aria-hidden="true">→</span>
      </a>
      <a class="report" href="reports/payment.html">
        <span class="num">R02</span>
        <span class="info"><strong>Payment Report</strong><small>Payments received, outstanding and overdue.</small></span>
        <span class="go" aria-hidden="true">→</span>
      </a>
      <a class="report" href="reports/crm.html">
        <span class="num">R03</span>
        <span class="info"><strong>CRM Report</strong><small>Customers, leads and pipeline.</small></span>
        <span class="go" aria-hidden="true">→</span>
      </a>
      </div>
      <!-- To add a category: copy the <h2 class="category"> and the <div class="reports"> below it. To add a report: copy one <a class="report"> block, bump the number, point href to a new page in reports/ -->
    </section>
  </main>

  <footer><p>&copy; <span id="year"></span> Jeremy</p></footer>
  <script src="assets/script.js"></script>
</body>
</html>
